<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 320px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .calculator:hover {
            transform: translateY(-5px);
        }

        .display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px 20px;
            margin-bottom: 25px;
            text-align: right;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .previous {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 5px;
            min-height: 20px;
        }

        .current {
            color: white;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .btn {
            height: 65px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-number {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-number:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-operator {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn-operator:hover {
            background: linear-gradient(135deg, #ff5252, #d63031);
        }

        .btn-clear {
            background: linear-gradient(135deg, #feca57, #ff9ff3);
            color: white;
        }

        .btn-clear:hover {
            background: linear-gradient(135deg, #ff9f43, #ee5a6f);
        }

        .btn-equals {
            background: linear-gradient(135deg, #00d2d3, #54a0ff);
            color: white;
            grid-column: span 2;
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #0abde3, #3867d6);
        }

        .btn-zero {
            grid-column: span 2;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1 class="title">Calculator</h1>
        <div class="display">
            <div class="previous" id="previous"></div>
            <div class="current" id="current">0</div>
        </div>
        <div class="buttons">
            <button class="btn btn-clear" onclick="clearAll()">C</button>
            <button class="btn btn-clear" onclick="deleteLast()">⌫</button>
            <button class="btn btn-operator" onclick="inputOperator('/')">/</button>
            <button class="btn btn-operator" onclick="inputOperator('*')">×</button>
            
            <button class="btn btn-number" onclick="inputNumber('7')">7</button>
            <button class="btn btn-number" onclick="inputNumber('8')">8</button>
            <button class="btn btn-number" onclick="inputNumber('9')">9</button>
            <button class="btn btn-operator" onclick="inputOperator('-')">-</button>
            
            <button class="btn btn-number" onclick="inputNumber('4')">4</button>
            <button class="btn btn-number" onclick="inputNumber('5')">5</button>
            <button class="btn btn-number" onclick="inputNumber('6')">6</button>
            <button class="btn btn-operator" onclick="inputOperator('+')">+</button>
            
            <button class="btn btn-number" onclick="inputNumber('1')">1</button>
            <button class="btn btn-number" onclick="inputNumber('2')">2</button>
            <button class="btn btn-number" onclick="inputNumber('3')">3</button>
            
            <button class="btn btn-number btn-zero" onclick="inputNumber('0')">0</button>
            <button class="btn btn-number" onclick="inputNumber('.')">.</button>
            <button class="btn btn-equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        // Global variables
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let waitingForOperand = false;

        // Get display elements
        const currentDisplay = document.getElementById('current');
        const previousDisplay = document.getElementById('previous');

        // Update display function
        function updateDisplay() {
            currentDisplay.textContent = currentInput;
            if (operator) {
                previousDisplay.textContent = previousInput + ' ' + (operator === '*' ? '×' : operator);
            } else {
                previousDisplay.textContent = '';
            }
        }

        // Input number function
        function inputNumber(num) {
            console.log('Number clicked:', num); // Debug log
            
            if (waitingForOperand) {
                currentInput = num;
                waitingForOperand = false;
            } else {
                if (currentInput === '0') {
                    currentInput = num;
                } else {
                    currentInput = currentInput + num;
                }
            }
            updateDisplay();
        }

        // Calculation functions
        function add(a, b) { return a + b; }
        function subtract(a, b) { return a - b; }
        function multiply(a, b) { return a * b; }
        function divide(a, b) { return a / b; }

        // Input operator function
        function inputOperator(nextOperator) {
            console.log('Operator clicked:', nextOperator); // Debug log
            
            const inputValue = parseFloat(currentInput);

            if (previousInput === '') {
                previousInput = inputValue;
            } else if (operator) {
                const currentValue = previousInput;
                let result;
                
                switch(operator) {
                    case '+': result = add(currentValue, inputValue); break;
                    case '-': result = subtract(currentValue, inputValue); break;
                    case '*': result = multiply(currentValue, inputValue); break;
                    case '/': result = divide(currentValue, inputValue); break;
                    default: result = inputValue;
                }

                currentInput = String(result);
                previousInput = result;
            }

            waitingForOperand = true;
            operator = nextOperator;
            updateDisplay();
        }

        // Calculate function
        function calculate() {
            console.log('Equals clicked'); // Debug log
            
            const inputValue = parseFloat(currentInput);

            if (previousInput !== '' && operator) {
                let result;
                
                switch(operator) {
                    case '+': result = add(previousInput, inputValue); break;
                    case '-': result = subtract(previousInput, inputValue); break;
                    case '*': result = multiply(previousInput, inputValue); break;
                    case '/': result = divide(previousInput, inputValue); break;
                    default: result = inputValue;
                }

                currentInput = String(result);
                previousInput = '';
                operator = null;
                waitingForOperand = false;
                updateDisplay();
            }
        }

        // Clear all function
        function clearAll() {
            console.log('Clear clicked'); // Debug log
            
            currentInput = '0';
            previousInput = '';
            operator = null;
            waitingForOperand = false;
            updateDisplay();
        }

        // Delete last function
        function deleteLast() {
            console.log('Delete clicked'); // Debug log
            
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // Initialize display
        updateDisplay();
        
        // Test function to check if JavaScript is working
        console.log('Calculator JavaScript loaded successfully!');
    </script>
</body>
</html>
