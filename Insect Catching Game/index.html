<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch The Insect</title>
    <link rel="stylesheet" href="sytle.css">
</head>

<body>
 <div class="screen active" id="screen-start">
    <h1>Catch The Insect</h1>
    <button class="btn" id="start-btn">Play Game</button>
    <button class="btn btn-secondary" id="view-leaderboard-btn">🏆 Leaderboard</button>
 </div>

 <div class="screen" id="screen-choose">
    <h1>What is your "favorite" insect?</h1>
    <ul class="insects-list">
        <li>
            <button class="choose-insect-btn">
                <p>Fly</p>
                <img src="https://pngimg.com/uploads/fly/fly_PNG3946.png" alt="fly">
            </button>
        </li>
         <li>
            <button class="choose-insect-btn">
                <p>Mosquito</p>
                <img src="https://pngimg.com/uploads/mosquito/mosquito_PNG18175.png" alt="mosquito">
            </button>
        </li>
         <li>
            <button class="choose-insect-btn">
                <p>Spider</p>
                <img src="https://pngimg.com/uploads/spider/spider_PNG12.png" alt="spider">
            </button>
        </li>
         <li>
            <button class="choose-insect-btn">
                <p>Roach</p>
                <img src="https://pngimg.com/uploads/roach/roach_PNG12163.png" alt="roach">
            </button>
        </li>
    </ul>
 </div>

  <div class="screen game-container" id="screen-game">
    <h3 id="time" class="time"> Time: 00:30</h3>
    <h3 id="score" class="score">Score: 0</h3>
    <h5 id="message" class="message">
        Are you annoyed yet? <br>
        You are playing an impossible game!!
    </h5>
    <h5 id="achievement" class="achievement">
        🌟 New High Score! 🌟
    </h5>
  </div>

  <div class="screen" id="screen-gameover">
    <h1>⏰ Time's Up!</h1>
    <h2 id="final-score">Your Score: 0</h2>
    <p id="best-score-text">Best Score: 0</p>

    <div class="name-entry" id="name-entry">
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="15">
        <button class="btn" id="submit-score-btn">Save Score</button>
    </div>

    <div class="post-save-buttons hidden" id="post-save-buttons">
        <button class="btn" id="see-leaderboard-btn">See Leaderboard</button>
        <button class="btn btn-secondary" id="play-again-btn">Play Again</button>
    </div>
  </div>

  <div class="screen" id="screen-leaderboard">
    <h1>🏆 Top Scores</h1>
    <ol class="leaderboard-list" id="leaderboard-list">
        <li>Loading...</li>
    </ol>
    <button class="btn" id="back-home-btn">Back to Home</button>
  </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
