<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch The Insext</title>
    <link rel="stylesheet" href="sytle.css">
</head>

<body>
 <div class="screen">
    <h1>Catch The Insect</h1>
    <button class="btn" id="start-btn">Play Game</button>
 </div>

 <div class="screen">
    <h1>What is your "favorite" insect?</h1>
    <ul class="insects-list">
        <li>
            <button class="choose-insect-btn">
                <p>Fly</p>
                <img src="https://pngimg.com/uploads/fly/fly_PNG3946.png" alt="flay">
            </button>
        </li>
         <li>
            <button class="choose-insect-btn">
                <p>Mosquito</p>
                <img src="https://pngimg.com/uploads/mosquito/mosquito_PNG18175.png" alt="mosquito">
            </button>
        </li>
         <li>
            <button class="choose-insect-btn">
                <p>spider</p>
                <img src="https://pngimg.com/uploads/spider/spider_PNG12.png" alt="flay">
            </button>
        </li>
         <li>
            <button class="choose-insect-btn">
                <p>Roach</p>
                <img src="https://pngimg.com/uploads/roach/roach_PNG12163.png" alt="flay">
            </button>
        </li>
    </ul>
 </div>

  <div class="screen game-container" id="game-container">
    <h3 id="time" class="time"> Time: 00:00</h3>
    <h3 id="score" class="score">Score: 0</h3>
    <h5 id="message" class="message">
        Are you annoyed yet? <br>
        You are playing an impossible game!!
    </h5>
  </div>
    <script src="script.js"></script>
</body>
</html>
